        - titel: Saugroboter X50
          typ: verschleiss
          breit: true
          fehler: sensor.saugroboter_error
          teile:
          - name: Hauptbürste
            entity: sensor.saugroboter_main_brush_left
            rest: sensor.saugroboter_main_brush_time_left
            reset: button.saugroboter_reset_main_brush
            knopf: getauscht
          - name: Seitenbürste
            entity: sensor.saugroboter_side_brush_left
            rest: sensor.saugroboter_side_brush_time_left
            reset: button.saugroboter_reset_side_brush
            knopf: getauscht
          - name: Filter
            entity: sensor.saugroboter_filter_left

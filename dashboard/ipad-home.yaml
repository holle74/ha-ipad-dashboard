              const big = a % 90 === 0, mid = a % 45 === 0; const r1 = big ? 76 : (mid ? 81 : 85); const rad = (a - 90) * Math.PI / 180; t += `<line x1="${(100 + r1 * Math.cos(rad)).toFixed(1)}" y1="${(100
              + r1 * Math.sin(rad)).toFixed(1)}" x2="${(100 + 90 * Math.cos(rad)).toFixed(1)}" y2="${(100 + 90 * Math.sin(rad)).toFixed(1)}" stroke="currentColor" stroke-opacity="${big ? 0.9 : 0.35}" stroke-width="${big

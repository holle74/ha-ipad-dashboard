# iPad-Dashboard (Vorlage) - im Dashboard ueber "Rohdaten-Konfigurationseditor" einfuegen.
# Entity-IDs sind Beispiele und muessen an das eigene System angepasst werden.

views:
- title: Home
  path: home
  type: panel
  icon: mdi:home
  cards:
  - type: custom:ipad-panel-layout
    sidebar_width: 250px
    sidebar:
      type: vertical-stack
      card_mod:
        style: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; }'
      cards:
      - type: custom:ipad-analog-clock
        size: 148
      - type: markdown
        card_mod:
          style: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; } ha-markdown { padding: 10px 6px 6px 6px !important; } h1 { font-size: 30px !important; font-weight:
            400 !important; margin: 0 0 4px 0 !important; color: #e8eef7 !important; } p { font-size: 15px !important; color: #8a94a6 !important; margin: 0 0 9px 0 !important; } hr { border: none; border-top:
            1px solid rgba(255,255,255,0.12); margin: 0 !important; } h1 span { font-size: 22px !important; font-weight: 300 !important; color: #8a94a6 !important; margin-left: 6px !important; }'
        content: |
          # Home{% set at = states('sensor.aussentemperatur_avarma_korrigiert') %}{% if is_number(at) %} <span>{{ at | float | round(1) | string | replace('.', ',') }}°</span>{% endif %}
          {% set wd = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][now().weekday()] %}{% set mo = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][now().month - 1] %}{{ wd }} {{ now().day }}. {{ mo }}

          ---
    content:
      type: vertical-stack
      card_mod:
        style: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; }'
      cards:
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:ipad-rahmen
          style: 'background: rgba(10,14,24,0.35); border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; box-shadow: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding:
            10px; max-width: 380px;'
          card:
            type: custom:trash-card
            entities:
            - calendar.abfallkalender
            event_grouping: true
            drop_todayevents_from: '10:00:00'
            next_days: 7
            filter_events: true
            hide_time_range: true
            day_style: counter
            alignment_style: center
            color_mode: icon
            items_per_row: 2
            refresh_rate: 60
            with_label: true
            layout: vertical
            icon_size: 24
            pattern:
            - icon: mdi:flower
              color: lime
              type: organic
              pattern: Bio
            - icon: mdi:newspaper
              color: light-blue
              type: paper
              pattern: Papier
            - icon: mdi:recycle-variant
              color: amber
              type: recycle
              pattern: Leicht
            - icon: mdi:trash-can-outline
              color: blue-grey
              type: waste
              pattern: Rest
            card_mod:
              style: 'ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; } .name, .label, .primary, .secondary, span, div
                { font-size: 12px !important; text-overflow: clip !important; overflow: visible !important; white-space: normal !important; }'
        - type: custom:ipad-rahmen
          style: 'background: rgba(10,14,24,0.35); border: 1px solid rgba(255,255,255,0.10); border-radius: 18px; box-shadow: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding:
            10px; max-width: 360px;'
          card:
            type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 5
            locale: de
            hide_clock: true
            hide_date: true
            hide_today_section: false
            hide_forecast_section: false
            animated_icon: true
            card_mod:
              style: 'ha-card { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; }'
            show_humidity: true
            tap_action:
              action: navigate
              navigation_path: /ipad-home/wetter
      - type: grid
        columns: 2
        square: false
        cards:
        - type: markdown
          content: |-
            ### Notification Center

            {% set ns = namespace(n=0) %}{% set akku = states('sensor.flur_battery') | int(-1) %}{% if 0 <= akku <= 10 and not is_state('binary_sensor.flur_charging', 'on') %}{% set ns.n = ns.n + 1 %}<ha-icon icon="mdi:battery-alert-variant-outline"></ha-icon> **Sonos Move: Akku {{ akku }} %** – bitte laden

            {% endif %}{% if ns.n == 0 %}_Keine Meldungen_{% endif %}
          card_mod:
            style: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; } h3 { color: #e8eef7 !important; font-weight: 400 !important; font-size: 22px !important;
              } p { color: #8a94a6 !important; } strong { color: #ffb4a8 !important; font-weight: 500 !important; } ha-icon { color: #ff6b5a; --mdc-icon-size: 20px; vertical-align: -4px; margin-right: 4px;
              }'
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            entity: person.person_1
            show_entity_picture: true
            show_state: true
            size: 58px
            styles:
              card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 2px
              entity_picture:
              - border-radius: 50%
              name:
              - font-size: 14px
              - color: '#e8eef7'
              state:
              - font-size: 12px
              - color: '#8a94a6'
            tap_action:
              action: navigate
              navigation_path: '#person1'
          - type: custom:button-card
            entity: person.person_2
            show_entity_picture: true
            show_state: true
            size: 58px
            styles:
              card:
              - background: none
              - border: none
              - box-shadow: none
              - padding: 2px
              entity_picture:
              - border-radius: 50%
              name:
              - font-size: 14px
              - color: '#e8eef7'
              state:
              - font-size: 12px
              - color: '#8a94a6'
            tap_action:
              action: navigate
              navigation_path: '#person2'
          card_mod:
            style: '#root { grid-gap: 4px !important; gap: 4px !important; max-width: 230px !important; margin: 0 0 0 65px !important; }'
    background: /local/ipad/bg_today.jpg
    caption_entity: sensor.bing_wallpaper
    sidebar_background: rgba(10,14,24,0.62)
    content_shadow: none
    corner:
      type: custom:ipad-rahmen
      style: 'flex-direction: row; align-items: flex-end; gap: 14px; overflow: visible; background: none; border: none; box-shadow: none; border-radius: 0;'
      cards:
      - type: custom:button-card
        name: Kameras
        icon: mdi:cctv
        size: 50px
        show_state: false
        show_label: true
        label: '[[[ const ids = [''switch.strasse_motion_detection'',''switch.flur_motion_detection'',''switch.hof_motion_detection'']; const an = ids.filter(i => states[i] && states[i].state === ''on'').length;
          return an + ''/'' + ids.length; ]]]'
        triggers_update:
        - switch.strasse_motion_detection
        - switch.flur_motion_detection
        - switch.hof_motion_detection
        tap_action:
          action: navigate
          navigation_path: '#cams'
        styles:
          card:
          - background: none
          - border: none
          - box-shadow: none
          - padding: 4px
          - width: 96px
          name:
          - font-size: 13px
          - color: '#e8eef7'
          - padding-top: 6px
          label:
          - font-size: 12px
          - color: '#b6c0ce'
          icon:
          - color: '#e8eef7'
    dialogs:
      '#cams':
        name: Kameras
        icon: mdi:cctv
        cards:
        - type: custom:bubble-card
          card_type: separator
          name: Bewegungserkennung
          icon: mdi:cctv
          sub_button:
            main: []
            bottom: []
          grid_options:
            columns: 12
        - type: custom:bubble-card
          card_type: button
          name: ''
          sub_button:
            main: []
            bottom: []
          show_attribute: false
          show_state: true
          button_type: switch
          icon: mdi:walk
          show_last_changed: true
          grid_options:
            columns: 12
          entity: switch.strasse_motion_detection
        - type: custom:bubble-card
          card_type: button
          name: ''
          sub_button:
            main: []
            bottom: []
          show_attribute: false
          show_state: true
          button_type: switch
          icon: mdi:walk
          show_last_changed: true
          grid_options:
            columns: 12
          entity: switch.flur_motion_detection
        - type: custom:bubble-card
          card_type: button
          name: ''
          sub_button:
            main: []
            bottom: []
          show_attribute: false
          show_state: true
          button_type: switch
          icon: mdi:walk
          show_last_changed: true
          grid_options:
            columns: 12
          entity: switch.hof_motion_detection
      '#person1':
        name: Person 1
        icon: mdi:map-marker-account
        cards:
        - type: map
          entities:
          - person.person_1
          theme_mode: light
          hours_to_show: 0
          aspect_ratio: '16:10'
          card_mod:
            style: 'ha-card { border: none !important; border-radius: 14px !important; }'
        - type: tile
          entity: person.person_1
          state_content:
          - state
          - last_changed
          card_mod:
            style: 'ha-card { background: rgba(255,255,255,0.05) !important; border: none !important; margin-top: 8px !important; }'
      '#person2':
        name: Person 2
        icon: mdi:map-marker-account
        cards:
        - type: map
          entities:
          - person.person_2
          theme_mode: light
          hours_to_show: 0
          aspect_ratio: '16:10'
          card_mod:
            style: 'ha-card { border: none !important; border-radius: 14px !important; }'
        - type: tile
          entity: person.person_2
          state_content:
          - state
          - last_changed
          card_mod:
            style: 'ha-card { background: rgba(255,255,255,0.05) !important; border: none !important; margin-top: 8px !important; }'
    nav:
    - name: Home
      icon: mdi:home
      path: home
      info:
      - entity: sensor.wp_raumtemperatur_mittel_eg
        label: EG
      - entity: sensor.raumtemperatur_mittel_og
        label: OG
    - name: Beleuchtung
      icon: mdi:ceiling-light
      path: beleuchtung
      count_entities:
      - light.wc
      - light.couchtisch
      - light.eg_bad_bad
      - light.ankleide_decke_1_2
      - light.licht_dusche_dusche
      - light.licht_buro_buro
      - light.stehlampe_buro
      - light.licht_kuche_kuche
      - light.kuche_arbeitsplatte
      - light.ankleide_decke_3
      - light.wohnzimmer
      - light.licht_esszimmer_esszimmer
      - light.licht_schlafzimmer_schlafzimmer
      - light.licht_yoga_decke_yoga
      - light.yogawand_yoga
      - light.licht_speicher_flur
      - light.rgbwic_string_lights
      - light.licht_dachterrasse_dachterrasse
      - light.licht_keller_keller
      count_state: 'on'
    - name: Beschattung
      icon: mdi:blinds-horizontal
      path: beschattung
    - name: Haushaltsgeräte
      icon: mdi:washing-machine
      path: haushaltsgeraete
      count_entities:
      - switch.kaffeevollautomat_einschalter
      - switch.kochfeld_einschalter
      - switch.geschirrspuler_einschalter
      - binary_sensor.waschmaschine_betrieb
      - binary_sensor.trockner_betrieb
      count_state:
      - 'on'
    - name: Musik
      icon: mdi:spotify
      path: musik
    - name: Einkaufsliste
      icon: mdi:cart-outline
      path: einkaufsliste
    - name: Auto
      icon: mdi:car
      path: auto
    - name: Energie
      icon: mdi:lightning-bolt
      path: energie
    - name: Heizung
      icon: mdi:heat-pump
      path: heizung
      info:
      - entity: switch.esphome_web_avarma_warmepumpe_ein_aus
        states:
          'on': an
          'off': aus
    - name: Wartung
      icon: mdi:cog-outline
      path: wartung
    - name: Hauptdashboard
      icon: mdi:home-export-outline
      path: /lovelace
      divider_before: true
    nav_base: /ipad-home
    standby_after: 10
    standby_entity: sensor.aussentemperatur_avarma_korrigiert
    standby_label: Draußen
  theme: ipad_panel

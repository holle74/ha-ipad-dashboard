          - sensor.gw2000a_humidity_5
          variables:
            cond: '[[[ const m = {''clear-night'':[''Klare Nacht'',''mdi:weather-night''],''cloudy'':[''Bewölkt'',''mdi:weather-cloudy''],''fog'':[''Nebel'',''mdi:weather-fog''],''hail'':[''Hagel'',''mdi:weather-hail''],''lightning'':[''Gewitter'',''mdi:weather-lightning''],''lightning-rainy'':[''Gewitter
              mit Regen'',''mdi:weather-lightning-rainy''],''partlycloudy'':[''Teils bewölkt'',''mdi:weather-partly-cloudy''],''pouring'':[''Starkregen'',''mdi:weather-pouring''],''rainy'':[''Regen'',''mdi:weather-rainy''],''snowy'':[''Schnee'',''mdi:weather-snowy''],''snowy-rainy'':[''Schneeregen'',''mdi:weather-snowy-rainy''],''sunny'':[''Sonnig'',''mdi:weather-sunny''],''windy'':[''Windig'',''mdi:weather-windy''],''windy-variant'':[''Windig,
              bewölkt'',''mdi:weather-windy-variant''],''exceptional'':[''Unwetter'',''mdi:alert'']}; const c = states[''weather.home''] ? states[''weather.home''].state : ''''; const r = parseFloat(states[''sensor.gw2000a_rain_rate_piezo''].state)
              || 0; if (r > 0) return [''Es regnet · '' + r.toFixed(1).replace(''.'', '','') + '' mm/h'', ''mdi:weather-pouring'', ''rain'']; const x = m[c] || [c, ''mdi:weather-cloudy'']; return [x[0],
              x[1], c]; ]]]'
          custom_fields:
            temp: '[[[ const t = parseFloat(entity.state); return isNaN(t) ? ''–'' : t.toFixed(1).replace(''.'', '','') + ''°''; ]]]'
            cond: '[[[ return variables.cond[0]; ]]]'
            icon: '[[[ return `<ha-icon icon="${variables.cond[1]}" style="--mdc-icon-size:54px;width:54px;height:54px;margin:0"></ha-icon>`; ]]]'
            facts: '[[[ const f = (e, d) => { const v = parseFloat(states[e] ? states[e].state : NaN); return isNaN(v) ? ''–'' : v.toFixed(d).replace(''.'', '',''); }; const dwd = states[''weather.home'']
              ? parseFloat(states[''weather.home''].attributes.temperature) : NaN; const g = parseFloat(entity.state); const diff = (!isNaN(dwd) && !isNaN(g)) ? (g - dwd) : NaN; const chip = (i, t) => `<span
              style="display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:11px;white-space:nowrap"><ha-icon icon="${i}" style="--mdc-icon-size:14px;width:14px;height:14px;margin:0;flex:none"></ha-icon>${t}</span>`;
              let s = chip(''mdi:thermometer-lines'', ''Gefühlt '' + f(''sensor.gw2000a_feels_like_temperature'', 1) + ''°'') + chip(''mdi:water-percent'', f(''sensor.gw2000a_humidity_5'', 0) + '' %'');
              if (!isNaN(diff)) s += chip(''mdi:image-filter-hdr'', ''Tal '' + (diff >= 0 ? ''+'' : ''−'') + Math.abs(diff).toFixed(1).replace(''.'', '','') + '' K ggü. DWD''); return `<div style="display:flex;flex-wrap:wrap;gap:5px">${s}</div>`;
              ]]]'
            sonne: '[[[ const a = states[''sun.sun''].attributes; const r = new Date(a.next_rising), s = new Date(a.next_setting); const fmt = d => d.toLocaleTimeString(''de-DE'', {hour: ''2-digit'', minute:
              ''2-digit''}); let len = s - r; if (len < 0) len += 86400000; const h = Math.floor(len / 3600000), m = Math.round((len % 3600000) / 60000); const ic = i => `<ha-icon icon="${i}" style="--mdc-icon-size:15px;width:15px;height:15px;margin:0;flex:none;color:#ffb703"></ha-icon>`;
              return `<div style="display:flex;gap:12px;align-items:center;white-space:nowrap">${ic(''mdi:weather-sunset-up'')}${fmt(r)} ${ic(''mdi:weather-sunset-down'')}${fmt(s)} ${ic(''mdi:timer-sand'')}${h}
              h ${m}</div>`; ]]]'
          styles:
            card:
            - background: '[[[ const k = variables.cond[2]; const day = states[''sun.sun''].state === ''above_horizon''; const g = (a, b) => `linear-gradient(140deg, ${a} 0%, ${b} 100%)`; if ([''rain'',''rainy'',''pouring'',''lightning'',''lightning-rainy'',''hail''].includes(k))
                return g(''rgba(90,107,128,.72)'', ''rgba(47,62,82,.72)''); if ([''snowy'',''snowy-rainy''].includes(k)) return g(''rgba(159,179,200,.72)'', ''rgba(95,120,145,.72)''); if (k === ''fog'')
                return g(''rgba(141,153,166,.72)'', ''rgba(88,99,111,.72)''); if (!day) return g(''rgba(36,52,94,.72)'', ''rgba(13,20,40,.72)''); if ([''cloudy'',''windy-variant''].includes(k)) return g(''rgba(124,156,191,.72)'',
                ''rgba(70,101,138,.72)''); if (k === ''partlycloudy'') return g(''rgba(90,169,230,.72)'', ''rgba(47,111,168,.72)''); return g(''rgba(76,179,255,.72)'', ''rgba(23,105,194,.72)''); ]]]'
            - border: 1px solid rgba(255,255,255,0.10)

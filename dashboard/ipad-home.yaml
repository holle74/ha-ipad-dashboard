              warn_merker: input_boolean.merker_spueler_salz_bald
            - name: Klarspüler
              warn: sensor.geschirrspuler_klarspuler_fast_leer
              alarm: sensor.kuche_geschirrspuler_fehlender_klarspuler
              warn_merker: input_boolean.merker_spueler_klarspueler_bald
              alarm_merker: input_boolean.merker_spueler_klarspueler_fehlt
            - name: Filter
              warn: sensor.kuche_geschirrspuler_intelligente_erinnerung_zur_filterreinigung
              warn_merker: input_boolean.merker_spueler_filter_reinigen
        - titel: System
          typ: system
          backup_letztes: sensor.backup_letztes_erfolgreiches_automatisches_backup
          backup_naechstes: sensor.backup_nachstes_geplantes_automatisches_backup
          backup_max_tage: 8
          cpu: sensor.system_monitor_prozessornutzung
          ram: sensor.system_monitor_arbeitsspeicherauslastung
        - titel: Neustart
          typ: neustart
          knoepfe:
          - name: Router
            entity: button.fritz_box_5590_fiber_neu_starten
          - name: Wohnzimmer
            entity: button.fritz_repeater_2400_neu_starten
          - name: Yoga
            entity: button.fritz_repeater_3000_ax_neu_starten
          - name: Ankleide
            entity: button.fritz_repeater_3000_ax_neu_starten_2
          - name: System
            aktion: hassio.host_reboot
            text: HAOS-Host

        '','') + (v.zusatz.einheit ? '' '' + v.zusatz.einheit : '''') : '''') + ''</span><span style="font-size:12px;font-weight:500;color:'' + farbe + '';white-space:nowrap">'' + blitz + text + ''</span></div>''
        + svg + ''</div>''; ]]]'

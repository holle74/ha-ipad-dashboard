            knopf: getauscht
          - name: Sensoren
            entity: sensor.saugroboter_sensor_dirty_left
            rest: sensor.saugroboter_sensor_dirty_time_left
            reset: button.saugroboter_reset_sensor
            knopf: gereinigt
          - name: Räder
            entity: sensor.saugroboter_wheel_dirty_left
            rest: sensor.saugroboter_wheel_dirty_time_left
            reset: button.saugroboter_reset_wheel
            knopf: gereinigt
          - name: Kalkschutz
            entity: sensor.saugroboter_scale_inhibitor_left
            rest: sensor.saugroboter_scale_inhibitor_time_left
            reset: button.saugroboter_reset_scale_inhibitor
            knopf: erneuert
        - titel: Küche
          typ: meldungen
          gruppen:
          - name: Kaffeevollautomat
            lampen:
            - name: Entkalken
              warn: sensor.kaffeevollautomat_entkalken_in_20_tassen
              alarm: sensor.kaffeevollautomat_entkalken_des_gerats_empfohlen
              warn_merker: input_boolean.merker_kaffee_entkalken_bald
              alarm_merker: input_boolean.merker_kaffee_entkalken_faellig
            - name: Calc'n'Clean
              warn: sensor.kaffeevollautomat_calc_n_clean_in_20_tassen
              warn_merker: input_boolean.merker_kaffee_calc_n_clean_bald
              alarm: sensor.kaffeevollautomat_calc_n_clean_des_gerats_empfohlen
              alarm_merker: input_boolean.merker_kaffee_calc_n_clean_faellig
            - name: Reinigung
              alarm: sensor.kaffeevollautomat_geratereinigung_empfohlen
              alarm_merker: input_boolean.merker_kaffee_reinigung_faellig
          - name: Geschirrspüler
            lampen:

      inhalt: '[[[ const v = variables || {}; const st = entity ? entity.state : ''unavailable''; const p = v.stufen ? (st in v.stufen ? v.stufen[st] : NaN) : (v.spannung ? (parseFloat(st) - v.spannung.leer)
        / (v.spannung.voll - v.spannung.leer) * 100 : parseFloat(st)); const le = v.laden_entity ? states[v.laden_entity] : null; const laedt = !!le && (v.laden_zustaende || [''on'', ''charging'', ''Charging'',
        ''CHARGINGACTIVE'']).includes(le.state); const text = isNaN(p) ? ''–'' : (v.stufen ? ((v.stufen_text || {})[st] || st) : (v.spannung ? parseFloat(st).toFixed(2).replace(''.'', '','') + '' V'' :
        Math.round(p) + '' %'')); const farbe = isNaN(p) ? ''#8a94a6'' : ''hsl('' + Math.round(Math.max(0, Math.min(p, 100)) / 100 * 120) + '',70%,56%)''; const blitz = laedt ? ''<ha-icon icon="mdi:lightning-bolt"
        style="--mdc-icon-size:11px;color:#f5b700;margin-right:1px;vertical-align:-2px"></ha-icon>'' : ''''; const an = isNaN(p) || p <= 0 ? 0 : Math.min(10, Math.max(1, Math.round(p / 10))); const b =
        (166 - 9 * 3) / 10; let seg = ''''; for (let i = 0; i < 10; i++) { const x = (6 + i * (b + 3)).toFixed(1); const f = ''hsl('' + Math.round(i / 9 * 120) + '',72%,50%)''; const r = ''<rect x="'' +
        x + ''" y="6" width="'' + b.toFixed(1) + ''" height="32" rx="2.5" fill="''; if (i < an) seg += r + f + ''"/>''; else if (laedt && i === an) seg += r + f + ''"><animate attributeName="opacity" values="0.12;0.9;0.12"
        dur="1.8s" repeatCount="indefinite"/></rect>''; else seg += r + ''rgba(255,255,255,0.07)"/>''; } const svg = ''<svg viewBox="0 0 188 44" width="100%" style="display:block" role="img" aria-label="''
        + v.name + '' '' + text + ''"><rect x="1" y="1" width="176" height="42" rx="7" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/><rect x="179" y="13" width="8" height="18"
        rx="2" fill="rgba(255,255,255,0.35)"/>'' + seg + ''</svg>''; return ''<div style="display:flex;flex-direction:column;gap:4px;width:100%"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:4px"><span
        style="font-size:10px;color:#8a94a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'' + v.name + (v.zusatz && states[v.zusatz.entity] && !isNaN(parseFloat(states[v.zusatz.entity].state))

            }; const zahl = id => { const s = states[id]; return s ? parseFloat(s.state) : NaN; }; const watt = id => { const s = states[id]; if (!s) return NaN; const w = parseFloat(s.state); return (s.attributes
            || {}).unit_of_measurement === ''kW'' ? w * 1000 : w; }; const leistungText = w => isNaN(w) ? ''–'' : (w >= 1000 ? (w / 1000).toFixed(2).replace(''.'', '','') + '' kW'' : Math.round(w) + ''
            W''); const rolle = (wert, ganz, dez, px) => { const zelle = (z, rot) => ''<span style="display:inline-flex;justify-content:center;align-items:center;width:'' + Math.round(px * 0.74) + ''px;height:''
            + Math.round(px * 1.32) + ''px;margin-right:2px;border-radius:3px;font-family:\''Roboto Mono\'',ui-monospace,Menlo,monospace;font-size:'' + px + ''px;font-weight:500;color:#f4f4f4;background:''
            + (rot ? ''linear-gradient(#6d0b10,#b3161d 50%,#6d0b10)'' : ''linear-gradient(#0b0b0b,#2b2b2b 50%,#0b0b0b)'') + '';box-shadow:inset 0 3px 3px rgba(0,0,0,.75),inset 0 -3px 3px rgba(0,0,0,.75)">''
            + z + ''</span>''; if (isNaN(wert)) return Array(ganz + dez).fill(0).map((_, i) => zelle(''–'', i >= ganz)).join(''''); const [g, d] = wert.toFixed(dez).split(''.''); const gz = g.padStart(ganz,
